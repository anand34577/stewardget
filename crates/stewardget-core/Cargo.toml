[package]
name = "stewardget-core"
description = "The download engine behind StewardGet: segmented, resumable, rate-limited HTTP downloads."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
tokio = { workspace = true, features = ["net", "io-util", "process"] }
tokio-util.workspace = true
futures-util.workspace = true
reqwest.workspace = true
getrandom = "0.4"
url.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
directories.workspace = true
percent-encoding.workspace = true
httpdate.workspace = true
chrono.workspace = true
sha2.workspace = true
sha1.workspace = true
md-5.workspace = true
aes.workspace = true
cbc.workspace = true
if-addrs = "0.15.0"
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }
tar = "0.4.46"
flate2 = "1.1.10"
bytes = "1.12.1"
roxmltree = "0.21.2"

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["io-util", "net"] }
